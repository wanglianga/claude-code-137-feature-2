# 一键启动：docker compose up --build
services:
  db:
    image: postgres:15
    container_name: med-recycle-db
    environment:
      POSTGRES_DB: medrecycle
      POSTGRES_USER: medrecycle
      POSTGRES_PASSWORD: medrecycle
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medrecycle -d medrecycle"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    container_name: med-recycle-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/medrecycle
      DB_USER: medrecycle
      DB_PASSWORD: medrecycle
      SEED_DEMO_DATA: "true"
    ports:
      - "8080:8080"

volumes:
  pgdata:
